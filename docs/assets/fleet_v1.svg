<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Fleet: member hosts collect payload files, the hub host-a pulls them into one catalog"><title>Fleet: member hosts collect payload files, the hub host-a pulls them into one catalog</title><g font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><rect width="1280" height="640" fill="#F8FAFC"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><text x="32" y="64" font-size="36" font-weight="700" fill="#0F172A" text-anchor="start" >One catalog for many machines</text><text x="32" y="102" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Members collect. The hub pulls.</text><rect x="24" y="190" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="159.0" y="238.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >host-b</text><text x="159.0" y="268.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >the-index collect</text><rect x="350" y="190" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="460.0" y="238.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >payload file</text><text x="460.0" y="268.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >JSON, one per run</text><path d="M294 245H348" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><path d="M570 245H600V335H648" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="360" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="159.0" y="408.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >host-c</text><text x="159.0" y="438.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >the-index collect</text><rect x="350" y="360" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="460.0" y="408.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >payload file</text><text x="460.0" y="438.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >JSON, one per run</text><path d="M294 415H348" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><path d="M570 415H600V395H648" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><rect x="650" y="265" width="320" height="190" rx="10" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.5"/><text x="810.0" y="326.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >host-a (hub)</text><text x="810.0" y="356.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >the-index pull</text><text x="810.0" y="383.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >over ssh, or from a</text><text x="810.0" y="410.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >shared inbox folder</text><rect x="1030" y="295" width="226" height="130" rx="10" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.5"/><text x="1143.0" y="340.0" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >One catalog</text><text x="1143.0" y="370.0" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >a single</text><text x="1143.0" y="397.0" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >SQLite file</text><path d="M970 360H1028" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><text x="32" y="560" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Members only write payload files.</text><text x="32" y="590" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >The hub ingests them into one catalog.</text></g></svg>
