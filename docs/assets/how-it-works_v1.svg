<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-label="How THE INDEX works: collectors to JSON to ingest to a SQLite file, then pages, CLI and MCP"><title>How THE INDEX works: collectors to JSON to ingest to a SQLite file, then pages, CLI and MCP</title><g font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><rect width="1280" height="680" fill="#F8FAFC"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><text x="32" y="64" font-size="36" font-weight="700" fill="#0F172A" text-anchor="start" >How THE INDEX works</text><text x="32" y="102" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Plain scripts in, one file out. Nothing is ever deleted from the catalog.</text><rect x="24" y="245" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="169.0" y="286.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >Collectors</text><text x="169.0" y="316.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >plain scripts: folders,</text><text x="169.0" y="343.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >files, jobs, containers,</text><text x="169.0" y="370.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >backups</text><rect x="346" y="280" width="100" height="80" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="396.0" y="327.0" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >JSON</text><rect x="478" y="245" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.5"/><text x="613.0" y="300.0" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >Ingest</text><text x="613.0" y="330.0" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >records what changed,</text><text x="613.0" y="357.0" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >never deletes</text><rect x="780" y="270" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.5"/><text x="865.0" y="313.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >SQLite file</text><text x="865.0" y="343.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >one catalog</text><rect x="1000" y="150" width="256" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="1128.0" y="193.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >Pages</text><text x="1128.0" y="223.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >Markdown + HTML</text><path d="M950 320H975V200H998" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1000" y="270" width="256" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="1128.0" y="313.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >CLI</text><text x="1128.0" y="343.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >find, status, changes</text><path d="M950 320H975V320H998" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1000" y="390" width="256" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><text x="1128.0" y="433.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >MCP</text><text x="1128.0" y="463.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >for AI agents</text><path d="M950 320H975V440H998" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><path d="M314 320H344" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><path d="M446 320H476" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><path d="M748 320H778" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah)"/><rect x="410" y="520" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5" stroke-dasharray="9 7"/><text x="540.0" y="558.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >watch</text><text x="540.0" y="588.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >live file changes</text><rect x="720" y="520" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5" stroke-dasharray="9 7"/><text x="900.0" y="558.5" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" >Other machines</text><text x="900.0" y="588.5" font-size="22" font-weight="400" fill="#475569" text-anchor="middle" >collect → inbox / ssh pull</text><path d="M540 518V397" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah)"/><path d="M900 518V460H690V397" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah)"/><text x="32" y="600" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Solid: the core path.</text><text x="32" y="630" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Dashed: optional extras.</text></g></svg>
