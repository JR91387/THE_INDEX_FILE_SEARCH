[project]
name = "the-index"
version = "0.1.0a0"
description = "A self-updating catalog of what exists on your machines: folders, jobs, containers, backups, and what changed."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
the-index = "theindex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theindex = ["schema/*.sql", "icons/*.svg", "pages/*.html", "pages/*.js"]

[tool.ruff]
line-length = 110
target-version = "py311"
