# SPDX-License-Identifier: MIT
# Speed test on every OS. Run by hand (workflow_dispatch); uploads each machine's bench JSON.
name: bench
on:
  workflow_dispatch:
    inputs:
      files:
        description: synthetic tree size
        default: "200000"
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bench
        env:
          PYTHONPATH: src
        run: python -m theindex bench --files ${{ inputs.files }} --out bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
